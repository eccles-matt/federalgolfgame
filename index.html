<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Federal Minigolf</title>
<meta name="description" content="Cartoon minigolf at Federal Golf Club, Canberra.">
<meta name="theme-color" content="#bfe4fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Federal Mini">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fff8e6; --ink: #3a5a2a; --muted: #8a7a55; --coral: #e2485e; --timber: #9c5f33;
    --sky: #bfe4fb; --grass: #80c65d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: linear-gradient(var(--sky) 50%, var(--grass) 50%);
    font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; color: var(--ink);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
  }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 360px; height: 760px; }
  img.side { position: absolute; top: 0; left: 0; width: 360px; height: 760px; transform-origin: 0 0; filter: blur(2px) saturate(.85) brightness(.92); pointer-events: none; }
  #stage img.bg, #stage canvas { position: absolute; inset: 0; width: 360px; height: 760px; display: block; pointer-events: none; }
  #hud { position: fixed; left: 0; right: 0; display: flex; gap: 10px; align-items: stretch; padding: 0 14px; pointer-events: none; z-index: 5; }
  .card { background: var(--cream); opacity: .96; border-radius: 16px; padding: 6px 14px 4px; box-shadow: 4px 5px 0 rgba(47,90,34,.18); }
  #holeCard { flex: 1 1 auto; min-width: 0; }
  #holeCard .t { font-size: 22px; line-height: 1.05; }
  #holeCard .s { font-size: 12px; color: var(--muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #shotCard { text-align: center; min-width: 70px; }
  #shotCard .s { font-size: 12px; color: var(--muted); line-height: 1.2; }
  #shots { font-size: 22px; color: var(--coral); line-height: 1.1; }
  #pauseBtn { pointer-events: auto; width: 44px; height: 44px; align-self: center; border: 0; border-radius: 50%; background: var(--cream); opacity: .96;
    display: grid; place-items: center; box-shadow: 4px 5px 0 rgba(47,90,34,.18); cursor: pointer; padding: 0; }
  #pauseBtn i { display: inline-block; width: 5px; height: 16px; border-radius: 2px; background: var(--ink); margin: 0 2px; }
  #toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); opacity: 0; z-index: 6; pointer-events: none;
    font-size: 34px; color: #fff; text-shadow: 3px 4px 0 rgba(47,90,34,.35); transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .25s; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .sheet { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: rgba(36,60,30,.35); padding: 20px; touch-action: auto; }
  .sheet.show { display: flex; }
  .panel { background: var(--cream); border-radius: 22px; padding: 20px 20px 18px; width: min(340px, 100%); box-shadow: 6px 8px 0 rgba(47,90,34,.25); text-align: center; max-height: 100%; overflow: auto; }
  .panel h2 { margin: 0; font-size: 30px; line-height: 1.1; }
  .panel .sub { color: var(--muted); font-size: 15px; margin: 2px 0 12px; }
  .big { font-size: 56px; color: var(--coral); line-height: 1; margin: 6px 0 2px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 12px 10px 9px; margin-top: 10px; font: inherit; font-size: 20px; cursor: pointer;
    background: #ff6b7f; color: #fff; box-shadow: 0 4px 0 #c94a5c; }
  .btn.alt { background: #cdee84; color: var(--ink); box-shadow: 0 4px 0 #94bf55; }
  .btn.ghost { background: transparent; color: var(--muted); box-shadow: none; font-size: 16px; margin-top: 6px; }
  .tune { text-align: left; margin-top: 8px; }
  .tune label { display: block; font-size: 14px; margin-top: 10px; }
  .tune label span { float: right; color: var(--muted); font-weight: 600; }
  .tune input[type=range] { width: 100%; accent-color: #e2485e; }
  .ver { color: var(--muted); font-size: 12px; font-weight: 600; margin-top: 10px; }
  #help { position: fixed; left: 50%; transform: translateX(-50%); z-index: 4; pointer-events: none; font-size: 15px; color: #fff;
    background: rgba(47,90,34,.55); border-radius: 999px; padding: 6px 14px 4px; transition: opacity .4s; white-space: nowrap; }
</style>
</head>
<body>
<img class="side" id="sideL" src="hole1.svg" alt="" draggable="false">
<img class="side" id="sideR" src="hole1.svg" alt="" draggable="false">
<div id="stage">
  <img class="bg" src="hole1.svg" alt="" draggable="false">
  <canvas id="cv"></canvas>
</div>

<div id="hud">
  <div class="card" id="holeCard"><div class="t">Hole 1</div><div class="s">Par 4 · The Opener</div></div>
  <div class="card" id="shotCard"><div class="s">SHOTS</div><div id="shots">0</div></div>
  <button id="pauseBtn" aria-label="Menu"><span><i></i><i></i></span></button>
</div>
<div id="help">Drag back from the ball, let go to putt</div>
<div id="toast"></div>

<div class="sheet" id="endSheet">
  <div class="panel">
    <h2 id="endTitle">Birdie!</h2>
    <div class="sub" id="endSub">Hole 1 · The Opener</div>
    <div class="big" id="endShots">3</div>
    <div class="sub" id="endBest"></div>
    <button class="btn" id="againBtn">Play again</button>
  </div>
</div>

<div class="sheet" id="menuSheet">
  <div class="panel">
    <h2>Paused</h2>
    <button class="btn" id="resumeBtn">Keep playing</button>
    <button class="btn alt" id="restartBtn">Restart hole</button>
    <div class="tune">
      <label>Putt power <span id="vPower"></span><input type="range" id="tPower" min="300" max="1000" step="10"></label>
      <label>Grass drag <span id="vGrass"></span><input type="range" id="tGrass" min="0.3" max="2.5" step="0.05"></label>
      <label>Sand grip <span id="vSand"></span><input type="range" id="tSand" min="1" max="10" step="0.25"></label>
      <label>Wall bounce <span id="vBounce"></span><input type="range" id="tBounce" min="0.3" max="0.95" step="0.01"></label>
      <label>Sound <span id="vSound"></span><input type="range" id="tSound" min="0" max="1" step="1"></label>
    </div>
    <button class="btn ghost" id="defaultsBtn">Reset feel to defaults</button>
    <div class="ver" id="ver"></div>
  </div>
</div>

<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
