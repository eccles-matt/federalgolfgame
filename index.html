<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Federal Minigolf</title>
<meta name="description" content="Cartoon minigolf at Federal Golf Club, Canberra.">
<meta name="theme-color" content="#bfe4fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Federal Mini">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fff8e6; --ink: #3a5a2a; --muted: #8a7a55; --coral: #e2485e; --pink: #ff6b7f; --timber: #9c5f33;
    --sky: #bfe4fb; --grass: #80c65d; --lime: #cdee84;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  /* fill the whole screen, including the status bar and home-indicator areas of an installed app */
  html { background: linear-gradient(var(--sky) 50%, var(--grass) 50%); min-height: 100vh; min-height: 100lvh; }
  body {
    position: fixed; inset: 0; height: auto;
    background: linear-gradient(var(--sky) 50%, var(--grass) 50%);
    font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; color: var(--ink);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  img.side { position: absolute; top: 0; left: 0; width: 360px; height: 760px; transform-origin: 0 0; filter: blur(2px) saturate(.85) brightness(.92); pointer-events: none; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 360px; height: 760px; }
  #stage img, #stage canvas { position: absolute; inset: 0; width: 360px; height: 760px; display: block; pointer-events: none; }

  /* menus sit over the blurred course art */
  .screen { position: fixed; inset: 0; z-index: 8; display: none; overflow: auto; touch-action: pan-y;
    padding: calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 20px); }
  .screen.on { display: flex; flex-direction: column; align-items: center; }
  #game.screen { display: none !important; }
  #home, #pick { background: linear-gradient(rgba(191,228,251,.25), rgba(47,90,34,.45)); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .inner { width: min(360px, 100%); margin: auto 0; }
  .logo { text-align: center; color: #fff; text-shadow: 3px 4px 0 rgba(47,90,34,.35); margin-bottom: 18px; }
  .logo .k { font-size: 18px; letter-spacing: .12em; text-transform: uppercase; opacity: .95; }
  .logo h1 { margin: 0; font-size: 54px; line-height: .95; }
  .logo .flag { display: inline-block; width: 4px; height: 44px; background: #fff; border-radius: 2px; position: relative; margin-right: 22px; vertical-align: -2px; }
  .logo .flag::after { content: ''; position: absolute; left: 4px; top: 2px; border-left: 22px solid var(--pink); border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
  .logo .where { font-size: 16px; opacity: .95; margin-top: 4px; }
  .menuBtn { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; border-radius: 18px; padding: 12px 18px 9px;
    margin-top: 12px; background: var(--cream); box-shadow: 4px 5px 0 rgba(47,90,34,.25); text-align: left; }
  .menuBtn .l { font-size: 24px; line-height: 1.05; }
  .menuBtn .s { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
  .menuBtn .best { font-size: 13px; color: var(--coral); white-space: nowrap; margin-left: 8px; }
  .menuBtn.primary { background: var(--pink); color: #fff; box-shadow: 0 5px 0 #c94a5c; }
  .menuBtn.primary .s { color: #ffe3e7; }
  .menuBtn.primary .best { color: #fff; }
  .foot { text-align: center; color: #fff; font-size: 12px; font-weight: 600; margin-top: 18px; text-shadow: 1px 1px 0 rgba(47,90,34,.4); }

  .pickHead { display: flex; align-items: center; gap: 10px; color: #fff; text-shadow: 2px 3px 0 rgba(47,90,34,.35); margin-bottom: 10px; }
  .pickHead h2 { margin: 0; font-size: 32px; flex: 1; }
  .back { border: 0; background: var(--cream); color: var(--ink); border-radius: 999px; padding: 6px 14px 3px; font-size: 16px; box-shadow: 3px 4px 0 rgba(47,90,34,.25); text-shadow: none; }
  #pickGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { border: 0; border-radius: 16px; background: var(--cream); padding: 8px 6px 6px; box-shadow: 3px 4px 0 rgba(47,90,34,.25); display: flex; flex-direction: column; align-items: center; min-height: 92px; }
  .tile .num { font-size: 30px; line-height: 1; color: var(--coral); }
  .tile .nm { font-size: 13px; line-height: 1.15; text-align: center; margin-top: 3px; }
  .tile .pr { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: auto; }

  #hud { position: fixed; left: 0; display: flex; gap: 10px; align-items: stretch; padding: 0 14px; pointer-events: none; z-index: 5; }
  .card { background: var(--cream); opacity: .96; border-radius: 16px; padding: 6px 14px 4px; box-shadow: 4px 5px 0 rgba(47,90,34,.18); }
  #holeCard { flex: 1 1 auto; min-width: 0; }
  #holeT { font-size: 22px; line-height: 1.05; }
  .card .s { font-size: 12px; color: var(--muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #roundTot { color: var(--coral); }
  #shotCard { text-align: center; min-width: 70px; }
  #shots { font-size: 22px; color: var(--coral); line-height: 1.1; }
  #pauseBtn { pointer-events: auto; width: 44px; height: 44px; flex: none; align-self: center; border: 0; border-radius: 50%; background: var(--cream); opacity: .96;
    display: grid; place-items: center; box-shadow: 4px 5px 0 rgba(47,90,34,.18); padding: 0; }
  #pauseBtn i { display: inline-block; width: 5px; height: 16px; border-radius: 2px; background: var(--ink); margin: 0 2px; }
  #toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); opacity: 0; z-index: 6; pointer-events: none;
    font-size: 34px; color: #fff; text-shadow: 3px 4px 0 rgba(47,90,34,.35); transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .25s; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #intro { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(.8); opacity: 0; z-index: 6; pointer-events: none; text-align: center;
    background: var(--cream); border-radius: 22px; padding: 14px 26px 10px; box-shadow: 6px 8px 0 rgba(47,90,34,.25); transition: transform .3s cubic-bezier(.3,1.6,.5,1), opacity .3s; }
  #intro.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #introT { font-size: 16px; color: var(--muted); }
  #introN { font-size: 30px; line-height: 1.05; white-space: nowrap; }
  #introS { font-size: 18px; color: var(--coral); }
  .sheet { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: rgba(36,60,30,.35); padding: 20px; touch-action: auto; }
  .sheet.show { display: flex; }
  .panel { background: var(--cream); border-radius: 22px; padding: 18px 18px 16px; width: min(350px, 100%); box-shadow: 6px 8px 0 rgba(47,90,34,.25); text-align: center; max-height: 100%; overflow: auto; }
  .panel h2 { margin: 0; font-size: 30px; line-height: 1.1; }
  .panel .sub { color: var(--muted); font-size: 15px; margin: 2px 0 8px; }
  .big { font-size: 56px; color: var(--coral); line-height: 1; margin: 4px 0 0; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 12px 10px 9px; margin-top: 10px; font-size: 20px;
    background: var(--pink); color: #fff; box-shadow: 0 4px 0 #c94a5c; }
  .btn.alt { background: var(--lime); color: var(--ink); box-shadow: 0 4px 0 #94bf55; }
  .btn.ghost { background: transparent; color: var(--muted); box-shadow: none; font-size: 16px; margin-top: 6px; }
  .sc table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; table-layout: fixed; }
  .sc th { text-align: left; color: var(--muted); font-weight: 600; width: 38px; }
  .sc td { text-align: center; padding: 2px 0; }
  .sc tr.hd td { color: var(--muted); font-weight: 600; }
  .sc td:last-child { font-weight: 800; color: var(--ink); width: 34px; }
  .sc .b { display: inline-block; min-width: 20px; line-height: 20px; padding-top: 2px; border-radius: 6px; }
  .sc .b.under { background: var(--pink); color: #fff; border-radius: 50%; }
  .sc .b.over { background: #e8dcc0; }
  .tune { text-align: left; margin-top: 8px; }
  .tune label { display: block; font-size: 14px; margin-top: 10px; }
  .tune label span { float: right; color: var(--muted); font-weight: 600; }
  .tune input[type=range] { width: 100%; accent-color: var(--coral); }
  .ver { color: var(--muted); font-size: 12px; font-weight: 600; margin-top: 10px; }
  #help { position: fixed; left: 50%; transform: translateX(-50%); z-index: 4; pointer-events: none; font-size: 15px; color: #fff;
    background: rgba(47,90,34,.55); border-radius: 999px; padding: 6px 14px 4px; transition: opacity .4s; white-space: nowrap; opacity: 0; }
</style>
</head>
<body>
<img class="side" id="sideL" src="holes/h18.svg" alt="" draggable="false">
<img class="side" id="sideR" src="holes/h18.svg" alt="" draggable="false">
<div id="stage">
  <img id="bg" src="holes/h18.svg" alt="" draggable="false">
  <canvas id="cv"></canvas>
</div>

<!-- welcome -->
<div class="screen" id="home">
  <div class="inner">
    <div class="logo">
      <div class="k">Federal</div>
      <h1><span class="flag"></span>Minigolf</h1>
      <div class="where">Red Hill · Canberra</div>
    </div>
    <button class="menuBtn primary" id="playFull"><span><span class="l">Full 18</span><span class="s" id="parFull"></span></span><span class="best" id="bestFull"></span></button>
    <button class="menuBtn" id="playFront"><span><span class="l">Front 9</span><span class="s" id="parFront"></span></span><span class="best" id="bestFront"></span></button>
    <button class="menuBtn" id="playBack"><span><span class="l">Back 9</span><span class="s" id="parBack"></span></span><span class="best" id="bestBack"></span></button>
    <button class="menuBtn" id="playPick"><span><span class="l">Play one hole</span><span class="s">Pick any of the 18</span></span><span class="best">›</span></button>
    <div class="foot">Drag back from the ball and let go to putt · <span id="homeVer"></span></div>
  </div>
</div>

<!-- pick a hole -->
<div class="screen" id="pick">
  <div class="inner">
    <div class="pickHead"><h2>Pick a hole</h2><button class="back" id="pickBack">Back</button></div>
    <div id="pickGrid"></div>
  </div>
</div>

<div class="screen" id="game"></div>

<div id="hud" style="display:none">
  <div class="card" id="holeCard"><div id="holeT">Hole 1</div><div class="s" id="holeS"></div><div class="s" id="roundTot"></div></div>
  <div class="card" id="shotCard"><div class="s">SHOTS</div><div id="shots">0</div></div>
  <button id="pauseBtn" aria-label="Menu"><span><i></i><i></i></span></button>
</div>
<div id="help">Drag back from the ball, let go to putt</div>
<div id="toast"></div>
<div id="intro"><div id="introT"></div><div id="introN"></div><div id="introS"></div></div>

<div class="sheet" id="endSheet">
  <div class="panel">
    <h2 id="endTitle">Birdie!</h2>
    <div class="sub" id="endSub"></div>
    <div class="big" id="endShots">3</div>
    <div class="sub" id="endBest"></div>
    <div id="endCard"></div>
    <button class="btn" id="nextBtn">Next hole</button>
    <button class="btn" id="againBtn">Play again</button>
    <button class="btn alt" id="pickBtn">Pick another hole</button>
  </div>
</div>

<div class="sheet" id="roundSheet">
  <div class="panel">
    <h2 id="rTitle">Round complete</h2>
    <div class="sub" id="rSub"></div>
    <div class="big" id="rShots"></div>
    <div class="sub" id="rPar"></div>
    <div id="rCard"></div>
    <button class="btn" id="rAgain">Play again</button>
    <button class="btn alt" id="rHome">Main menu</button>
  </div>
</div>

<div class="sheet" id="menuSheet">
  <div class="panel">
    <h2>Paused</h2>
    <button class="btn" id="resumeBtn">Keep playing</button>
    <button class="btn alt" id="restartBtn">Restart hole</button>
    <button class="btn alt" id="quitBtn">Main menu</button>
    <div class="tune">
      <label>Putt power <span id="vPower"></span><input type="range" id="tPower" min="300" max="1000" step="10"></label>
      <label>Grass drag <span id="vGrass"></span><input type="range" id="tGrass" min="0.3" max="2.5" step="0.05"></label>
      <label>Sand grip <span id="vSand"></span><input type="range" id="tSand" min="1" max="10" step="0.25"></label>
      <label>Wall bounce <span id="vBounce"></span><input type="range" id="tBounce" min="0.3" max="0.95" step="0.01"></label>
      <label>Sound <span id="vSound"></span><input type="range" id="tSound" min="0" max="1" step="1"></label>
    </div>
    <button class="btn ghost" id="defaultsBtn">Reset feel to defaults</button>
    <div class="ver" id="ver"></div>
  </div>
</div>

<script src="holes.js"></script>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
